<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museum of Unsaid Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--acc:#d9b46a;--ink:#f6e9e4;--bg:#241419;--mid:#b9949b;--card:#3a2229;--line:rgba(217,180,106,.38)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:'Jost',Helvetica,Arial,sans-serif;font-weight:300}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.caps{letter-spacing:.28em;text-transform:uppercase;font-weight:400}
button{font:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#splash{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(36,20,25,.5);backdrop-filter:blur(6px);transition:opacity 1.2s ease,visibility 1.2s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.plate{max-width:600px;padding:56px 52px 46px;text-align:center;background:rgba(58,34,41,.88);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.plate .kicker{font-size:11px;color:var(--acc)}
.plate h1{margin:.2em 0 .3em;color:var(--acc);font:400 clamp(46px,9vw,84px)/1.1 'Pinyon Script','Cormorant Garamond',cursive}
.plate p{margin:1.4em auto 1.8em;font-size:17px;line-height:1.7;max-width:28em;color:#6b665e}
.gold{background:var(--acc);color:#3a2229;border:0;padding:14px 30px;border-radius:999px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;transition:background .3s}
.gold:hover{background:#ecd08e}
.gold:disabled{opacity:.5;cursor:default}
.ghost{background:rgba(58,34,41,.8);color:var(--ink);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;transition:background .3s}
.ghost:hover{background:var(--ink);color:var(--card)}
.tiny{margin-top:1.4em;font-size:13px;color:var(--mid)}
.hud{position:fixed;z-index:10;transition:opacity .8s}
.hud.off{opacity:0;pointer-events:none}
#brand{top:calc(20px + env(safe-area-inset-top,0px));left:24px;font-size:11px}
#brand small{display:block;margin-top:6px;color:var(--acc);font-size:10px}
#actions{top:calc(14px + env(safe-area-inset-top,0px));right:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#actions .gold{padding:10px 20px;font-size:11px}
#hint{bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7a746a;text-align:center;width:min(94vw,820px);pointer-events:none}
#cap{top:calc(68px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;width:min(92vw,760px);pointer-events:none;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
#walk{bottom:calc(80px + env(safe-area-inset-bottom,0px));right:18px;display:none;flex-direction:column;gap:10px}
#walk button{width:54px;height:54px;background:rgba(58,34,41,.85);color:var(--ink);border:1px solid var(--line);font-size:16px;border-radius:50%}
@media (hover:none){#walk{display:flex}}
#toast{position:fixed;z-index:40;bottom:110px;left:50%;transform:translate(-50%,12px);background:var(--card);border-radius:16px;padding:14px 22px;max-width:min(90vw,520px);font-size:15px;box-shadow:0 14px 40px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .5s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#reticle{position:fixed;z-index:9;left:50%;top:50%;width:6px;height:6px;margin:-3px;opacity:0}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(28,14,18,.75);backdrop-filter:blur(8px)}
.modal[hidden]{display:none}
.card{position:relative;width:min(560px,100%);max-height:94vh;overflow:auto;padding:38px 38px 30px;background:var(--card);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card h2{margin:0;color:var(--acc);font:400 46px 'Pinyon Script','Cormorant Garamond',cursive}
.card .sub{margin:.3em 0 1em;color:var(--mid);font-size:15px}
.card label,.card legend{display:block;margin:18px 0 0;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:400}
.opt{float:right;text-transform:none;letter-spacing:0;font-size:11px;color:var(--mid)}
.card input[type=text],.card textarea{width:100%;margin-top:6px;padding:11px 14px;background:#4a2c35;color:var(--ink);border:1px solid transparent;border-radius:12px;font:400 17px/1.5 'Jost',sans-serif;outline:none}
.card input:focus,.card textarea:focus{border-color:var(--acc)}
.card textarea{resize:vertical;min-height:130px}
.card fieldset{border:0;padding:0;margin:0}
.frames{display:flex;gap:10px;margin-top:8px}
.sw{flex:1;cursor:pointer;margin:0!important;text-align:center;letter-spacing:.1em!important}
.sw input{position:absolute;opacity:0}
.sw span{display:block;padding:10px 4px 8px;border:1px solid transparent;border-radius:14px;color:var(--ink);font-size:11px}
.sw i{display:block;height:34px;margin-bottom:6px;border:5px solid;border-radius:6px}
.sw input:checked+span{border-color:var(--acc)}
.sw input:focus-visible+span{outline:2px solid var(--acc)}
.row{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
.msg{min-height:1.4em;margin:12px 0 0;color:#d9937a;font-size:14px}
.x{position:absolute;top:10px;right:16px;background:none;border:0;color:var(--mid);font-size:28px;line-height:1}
.nogl #stage{display:none}
.nogl #sr{position:fixed;inset:80px 0 0;overflow:auto;width:auto;height:auto;clip:auto;white-space:normal;padding:20px;list-style:none;margin:0;z-index:5}
.nogl #sr li{max-width:560px;margin:0 auto 18px;padding:22px 26px;background:var(--card);border-radius:18px;font:500 20px/1.5 'Cormorant Garamond',serif;white-space:pre-wrap}
.nogl #hint,.nogl #walk{display:none}
#brand,#hint,#cap,#b-entrance,#b-wander,.sub,.opt,.card legend,.tiny{display:none}
.plate,.card{outline:1px solid var(--line);outline-offset:-10px}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="A soft, minimalist gallery of anonymous unsaid words. Move the mouse to look, scroll to walk, click a frame to read."></canvas>
<div id="reticle"></div>

<div id="splash">
  <div class="plate">
    <h1>Museum of<br>Unsaid Words</h1>
    <button class="gold" id="enter" type="button">Enter</button>
    <div class="tiny" id="loadnote">Opening the windows&hellip;</div>
  </div>
</div>

<div class="hud off" id="brand"><span class="caps">Museum of Unsaid Words</span><small class="caps" id="count"></small></div>
<div class="hud off" id="actions">
  <button class="ghost" id="b-entrance" type="button">Entrance</button>
  <button class="ghost" id="b-wander" type="button">Wander</button>
  <button class="gold" id="b-add" type="button">Leave an unsaid word</button>
</div>
<div class="hud off" id="cap"></div>
<div class="hud off" id="hint"></div>
<div class="hud off" id="walk"><button id="w-up" type="button" aria-label="Walk forward">&#9650;</button><button id="w-down" type="button" aria-label="Walk back">&#9660;</button></div>
<div id="toast" role="status"></div>
<ul id="sr" class="sr" aria-label="All unsaid words"></ul>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt">
  <form class="card" id="form" autocomplete="off">
    <button type="button" class="x" id="close" aria-label="Close">&times;</button>
    <h2 id="mt">Leave an Unsaid Word</h2>
    <p class="sub">No account, no email, no trace &mdash; only the words.</p>
    <label for="f-to">To <span class="opt">optional</span></label>
    <input type="text" id="f-to" maxlength="60" placeholder="My mother &middot; the stranger on the train &middot; myself">
    <label for="f-text">The words <span class="opt" id="count2">0 / 420</span></label>
    <textarea id="f-text" maxlength="420" required placeholder="Say it here&hellip;"></textarea>
    <label for="f-from">From <span class="opt">an invented name &mdash; blank to be given one</span></label>
    <input type="text" id="f-from" maxlength="32" placeholder="The Quiet Heron">
    <fieldset>
      <legend>Choose a frame</legend>
      <div class="frames">
        <label class="sw"><input type="radio" name="style" value="gilt" checked><span><i style="border-color:#b8924a;background:#f0e2d6"></i>Cream</span></label>
        <label class="sw"><input type="radio" name="style" value="ebony"><span><i style="border-color:#d9b46a;background:#4a2a38"></i>Plum</span></label>
        <label class="sw"><input type="radio" name="style" value="rose"><span><i style="border-color:#b8924a;background:#ebc8c8"></i>Rose</span></label>
      </div>
    </fieldset>
    <div class="row"><button type="button" class="ghost" id="cancel">Cancel</button><button type="submit" class="gold" id="hang">Hang</button></div>
    <p class="msg" id="msg" role="status"></p>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function(){
'use strict';

/* ---------- data ---------- */
const STYLE_KEYS=['gilt','ebony','rose'];
const SEEDS=[
 {to:'My father',text:"I learned to make your coffee exactly the way you liked it. It was the only way I knew how to say it.",from:'The Quiet Heron',style:'gilt'},
 {to:'The friend I let drift',text:"I wasn't angry. I was tired, and ashamed of being tired, and silence was easier than explaining. I still reread your old messages.",from:'A Borrowed Umbrella',style:'ebony'},
 {to:'Whoever lived here before me',text:"I found your height marks on the closet door and could not paint over them. I hope the next child grows past mine.",from:'Tenant of Room Four',style:'rose'},
 {to:'Myself, at seventeen',text:"You were right about the music and wrong about almost everything else. Be kind to the person who has to live with your choices.",from:'Later',style:'gilt'},
 {to:'The stranger on the 6:40 train',text:"You smiled at me on the day I had decided to stop smiling. Thank you. I don't think you will ever know.",from:'Seat 14B',style:'ebony'},
 {to:'My sister',text:"I'm sorry I said it was just a dress. It was never the dress.",from:'The Younger One',style:'rose'},
 {to:'Mama',text:"\"I'm fine\" is the lie we taught each other. I am not fine. I don't think you were either.",from:'A Small Lantern',style:'gilt'},
 {to:'The version of us that never happened',text:"I would have loved you well in that other city. Be happy there.",from:'Elsewhere',style:'ebony'},
 {to:'The teacher who noticed',text:"You wrote 'keep going' in the margin of a bad essay. I am a writer now. I never told you.",from:'Margin Note',style:'rose'},
 {to:'Whoever reads this',text:"You are allowed to take up space. Somebody should have said it to you sooner. I am saying it now.",from:'The Last Candle',style:'gilt'}
].map((s,i)=>Object.assign({id:'seed'+i,t:1700000000000-i*86400000,seed:true},s));

const ADJ=['Quiet','Gilded','Midnight','Velvet','Patient','Faded','Hollow','Gentle','Wintering','Tender','Borrowed','Lantern-lit','Slow','Wandering','Candlewick'];
const NOUN=['Heron','Moth','Violin','Cartographer','Sparrow','Sleeper','Hour','Window','Orchard','Tide','Clockmaker','Fox','Chorister','Page','Ember'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const randomName=()=>'The '+pick(ADJ)+' '+pick(NOUN);

const cleanLine=(s,n)=>String(s==null?'':s).replace(/[\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,n);
const cleanText=(s,n)=>String(s==null?'':s).replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim().slice(0,n);
function sanitize(d,id){
  if(!d||typeof d!=='object') return null;
  const text=cleanText(d.text,420); if(!text) return null;
  return {id:String(id),to:cleanLine(d.to,60),text,from:cleanLine(d.from,32)||'Anonymous',
    style:STYLE_KEYS.indexOf(d.style)>=0?d.style:'gilt',t:typeof d.t==='number'&&isFinite(d.t)?d.t:0};
}

const remote=new Map();
function allPieces(){
  const m=new Map();
  SEEDS.forEach(p=>m.set(p.id,p));
  remote.forEach((p,id)=>m.set(id,p));
  return Array.from(m.values()).sort((a,b)=>b.t-a.t).slice(0,300);
}

/* ---------- shared db ---------- */
let dbP=null;
function getDb(){
  if(!dbP){
    dbP=(async()=>{
      try{
        if(window.claude&&window.claude.use){ const d=await window.claude.use('db'); if(d) return d; }
        const c=window.FIREBASE_CONFIG;
        if(window.firebase&&c&&c.projectId&&c.apiKey&&c.apiKey.indexOf('PASTE')<0){ if(!firebase.apps.length) firebase.initializeApp(c); return firebase.firestore(); }
      }catch(e){}
      return null;
    })();
  }
  return dbP;
}

/* ---------- ui refs ---------- */
const $=id=>document.getElementById(id);
const canvas=$('stage'),splash=$('splash'),hint=$('hint'),cap=$('cap'),toastEl=$('toast');
let toastT=0;
function toast(msg,ms){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),ms||4200); }

/* ---------- fonts ---------- */
const fontsReady=Promise.race([
  Promise.all(['500 24px "Cormorant Garamond"','italic 500 24px "Cormorant Garamond"','400 24px "Jost"','400 24px "Pinyon Script"'].map(f=>document.fonts.load(f).catch(()=>null))),
  new Promise(r=>setTimeout(r,3500))
]);

if(typeof THREE==='undefined'){ document.body.classList.add('nogl'); $('loadnote').textContent='The lights would not come on (3D library unavailable) — a plain gallery is shown instead.'; }

fontsReady.then(init);

function init(){
  let renderer=null;
  if(typeof THREE!=='undefined'){
    try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }catch(e){ renderer=null; }
  }
  if(!renderer){
    document.body.classList.add('nogl');
    wireUi(null);
    return;
  }
  run(renderer);
}

/* ---------- 3D ---------- */
function run(renderer){
  const HALF=6,H=9.2,FW=2.7,FH=3.4,FRAME_Y=3.7,SP=3.8,Z0=-5,EYE=3.3;
  const scene=new THREE.Scene();
  const FOG=0x2b1a20;
  scene.background=new THREE.Color(FOG);
  scene.fog=new THREE.FogExp2(FOG,0.04);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const camera=new THREE.PerspectiveCamera(62,1,0.1,90);
  camera.rotation.order='YXZ';
  scene.add(camera);
  scene.add(new THREE.HemisphereLight(0xffe0d8,0x3a2229,.9));
  const camLight=new THREE.PointLight(0xffd2a0,1.2,26,1.4); camLight.position.set(0,1.2,0.5); camera.add(camLight);

  function resize(){
    const w=window.innerWidth,h=window.innerHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.fov=w/h<0.9?78:62; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize); resize();

  const keep=o=>{o.userData=o.userData||{};o.userData.keep=true;return o;};
  const geoCache=new Map();
  function planeG(w,h){const k='p'+w+'|'+h;let g=geoCache.get(k);if(!g){g=keep(new THREE.PlaneGeometry(w,h));geoCache.set(k,g);}return g;}
  const U=keep(new THREE.BoxGeometry(1,1,1));
  const CYL=keep(new THREE.CylinderGeometry(1,1,1,6));
  const std=(c,m,r,e)=>keep(new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r,emissive:e||0x000000}));
  const M={gold:std(0xd4af5a,.35,.4,0x3a2a0c),gold2:std(0x9c7a32,.35,.5,0x201606),plaster:std(0xa8727f,0,.95,0x0a0405),ceil:std(0xcfa6a2,0,1,0x050203),cream:std(0xe6cfc4,0,.9,0x000000),rug:std(0x6b2438,0,1,0x000000),wine:std(0x4a2a38,0,1,0x000000)};

  function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
  function rep(t,x,y){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(x,y);t.anisotropy=4;return t;}
  function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}


  /* typographic paper */
  const PAPER={
    gilt:{bg:'#f0e2d6',ink:'#4a2a38',acc:'#b8924a',dim:'#8a6a6e'},
    ebony:{bg:'#4a2a38',ink:'#f3e1dc',acc:'#d9b46a',dim:'#b99aa0'},
    rose:{bg:'#ebc8c8',ink:'#4a2a38',acc:'#b8924a',dim:'#8a5a64'}
  };
  function wrapText(g,text,maxW){
    const out=[]; text=text.replace(/(\S{22})(?=\S)/g,'$1 ');
    text.split('\n').forEach(par=>{
      if(!par.trim()){out.push('');return;}
      let line=''; par.split(' ').forEach(w=>{ const t=line?line+' '+w:w; if(g.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t; });
      out.push(line);
    });
    return out;
  }
  function spaced(g,v){ try{ g.letterSpacing=v; }catch(e){} }
  function poly(g,pts){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); g.fill(); }
  function diamond(g,x,y,r){ g.save(); g.translate(x,y); g.rotate(Math.PI/4); g.fillRect(-r,-r,2*r,2*r); g.restore(); }
  function paintPiece(p,num){
    const [c,g]=cv(800,1000); const st=PAPER[p.style]||PAPER.gilt;
    g.fillStyle=st.bg; g.fillRect(0,0,800,1000);
    const vg=g.createRadialGradient(400,500,200,400,500,640); vg.addColorStop(0,'rgba(255,255,255,.12)'); vg.addColorStop(1,'rgba(0,0,0,.16)'); g.fillStyle=vg; g.fillRect(0,0,800,1000);
    g.strokeStyle=st.acc; g.lineWidth=4; g.strokeRect(28,28,744,944); g.lineWidth=1.2; g.strokeRect(46,46,708,908);
    g.fillStyle=st.acc; [[46,46],[754,46],[46,954],[754,954]].forEach(q=>diamond(g,q[0],q[1],9));
    g.fillRect(250,118,120,1.5); g.fillRect(430,118,120,1.5); diamond(g,400,119,7);
    g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillStyle=st.dim; g.font='400 18px "Jost"'; spaced(g,'7px'); g.fillText('N\u00ba '+String(num).padStart(3,'0'),400,170); spaced(g,'0px');
    g.fillStyle=st.acc; g.font='italic 500 28px "Cormorant Garamond"'; g.fillText('to',400,250);
    const to=p.to||'no one in particular'; let s=82; do{ g.font='400 '+s+'px "Pinyon Script"'; s-=3; }while(g.measureText(to).width>600&&s>30);
    g.fillStyle=st.ink; g.fillText(to,400,336);
    let size=44,lines; for(;size>=22;size-=2){ g.font='500 '+size+'px "Cormorant Garamond"'; lines=wrapText(g,p.text,580); if(lines.length*size*1.34<=400) break; }
    lines.forEach((ln,i)=>g.fillText(ln,400,410+size+i*size*1.34));
    const from='\u2014 '+p.from; let fs=28; do{ g.font='italic 500 '+fs+'px "Cormorant Garamond"'; fs-=2; }while(g.measureText(from).width>600&&fs>14);
    g.fillStyle=st.dim; g.fillText(from,400,904);
    return c;
  }
  function paintSubmit(){
    const [c,g]=cv(800,1000); g.fillStyle='#4a2a38'; g.fillRect(0,0,800,1000);
    g.strokeStyle='#d9b46a'; g.lineWidth=4; g.strokeRect(28,28,744,944); g.lineWidth=1.2; g.strokeRect(46,46,708,908);
    g.fillStyle='#d9b46a'; [[46,46],[754,46],[46,954],[754,954]].forEach(q=>diamond(g,q[0],q[1],9)); diamond(g,400,150,9);
    g.textAlign='center'; g.fillStyle='#f3e1dc'; g.font='400 112px "Pinyon Script"'; ['Yours','could hang','here'].forEach((t,i)=>g.fillText(t,400,360+i*140));
    g.fillStyle='#d9b46a'; g.font='400 20px "Jost"'; spaced(g,'7px'); g.fillText('CLICK TO WRITE',400,880); spaced(g,'0px');
    return c;
  }
  function paintPlaque(text){
    const [c,g]=cv(512,128); g.fillStyle='#c9a24d'; g.fillRect(0,0,512,128);
    g.fillStyle='#3a2229'; g.textAlign='center'; g.textBaseline='middle';
    let s=30; do{ g.font='400 '+s+'px "Jost"'; s-=2; }while(g.measureText(text).width>470&&s>12);

function wireUi(gl){
  if(gl) return;
  /* fallback mode: plain list + same form */
  const modal=$('modal'); let uiOpen=false;
  $('splash').classList.add('gone');
  ['brand','actions'].forEach(id=>$(id).classList.remove('off'));
  ['b-entrance','b-wander'].forEach(id=>$(id).style.display='none');
  function render(){ const sr=$('sr'); sr.textContent=''; allPieces().forEach(p=>{ const li=document.createElement('li'); li.textContent='To '+(p.to||'no one in particular')+'\n\n'+p.text+'\n\n— '+p.from; sr.appendChild(li); }); $('count').textContent=allPieces().length+' unsaid words on display'; }
  render();
  _open=()=>{ modal.hidden=false; uiOpen=true; }; _close=()=>{ modal.hidden=true; uiOpen=false; };
  $('b-add').addEventListener('click',()=>_open());
  $('f-text').addEventListener('input',()=>{ $('count2').textContent=$('f-text').value.length+' / 420'; });
  $('form').addEventListener('submit',async e=>{
    e.preventDefault(); const text=cleanText($('f-text').value,420); if(!text) return;
    const sel=document.querySelector('input[name=style]:checked');
    const piece={to:cleanLine($('f-to').value,60),text,from:cleanLine($('f-from').value,32)||randomName(),style:sel?sel.value:'gilt',t:Date.now()};
    const db=await getDb(); if(!db){ toast('The shared gallery is unreachable right now.'); return; }
    try{ const id=(await db.collection('words').add(piece)).id; remote.set(id,Object.assign({id},piece)); }catch(err){ toast('Your words could not be hung just now.'); return; }
    $('form').reset(); _close(); render(); toast('Hung in the gallery.');
  });
  getDb().then(db=>{ if(db) try{ db.collection('words').orderBy('t','desc').limit(300).onSnapshot(s=>{ remote.clear(); s.docs.forEach(d=>{ const x=sanitize(d.data(),d.id); if(x) remote.set(d.id,x); }); render(); },()=>{}); }catch(e){} });
}
/* modal close controls (both modes) */
function closeAny(){ if(_close) _close(); }
$('close').addEventListener('click',closeAny);
$('cancel').addEventListener('click',closeAny);
modalBackdrop();
function modalBackdrop(){ $('modal').addEventListener('pointerdown',e=>{ if(e.target===$('modal')) closeAny(); }); }
})();
</script>
</body>
</html>
